name = "voice-agent-api"
main = "src/index.ts"
compatibility_date = "2024-09-23"
workers_dev = true
minify = true

[observability]
enabled = true

[triggers]
# Hourly: reminders + calendar failure alerts. Every 15 min: two-way calendar sync.
crons = ["0 * * * *", "*/15 * * * *"]

[vars]
SUPABASE_URL = "https://ypvlndfdszdinvpebumb.supabase.co"
ENVIRONMENT = "development"

# Secrets — set via: wrangler secret put <NAME>
# SUPABASE_SERVICE_ROLE_KEY
# ELEVENLABS_WEBHOOK_SECRET
# ELEVENLABS_API_KEY
# ELEVENLABS_TEMPLATE_AGENT_ID
# TWILIO_ACCOUNT_SID
# TWILIO_AUTH_TOKEN
# TWILIO_SMS_FROM  (optional shared SMS sender, e.g. verified toll-free; unset → send from each shop's twilio_number)
# ENCRYPTION_KEY  (32-byte hex string for AES-256-GCM)
# ADMIN_API_KEYS  (comma-separated list of bearer tokens)
# TEAM_ALERT_PHONE  (optional; E.164 number that receives Google Calendar failure alerts — unset disables them)
